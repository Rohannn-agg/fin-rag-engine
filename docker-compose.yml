version: '3.8'

services:
  financial-rag:
    build: .
    container_name: lseg-financial-rag
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SEC_USER_AGENT=FinancialResearchGroup admin@financialrag.org
    volumes:
      - ./data:/app/data
    restart: unless-stopped

